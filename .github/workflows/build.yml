name: Build Archdesign Wheel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: archdesign-wheel-debug-key
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the app
        run: gradle assembleDebug --no-daemon
      - name: Publish the app file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ArchdesignWheel.apk
          gh release create "v${{ github.run_number }}" ArchdesignWheel.apk --title "Archdesign Wheel v${{ github.run_number }}" --notes "On your phone: tap ArchdesignWheel.apk below to download, then open it to install."
